name: Mobile CI

on:
  push:
    branches: [main, staging]
    tags:
      - "mobile-v*"
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    branches: [main, staging]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:
    inputs:
      build_ios:
        description: Build IPA (requires ENABLE_IOS_IPA=true and ASC secrets)
        type: boolean
        default: false
      upload_play:
        description: Upload AAB to Play internal (requires ENABLE_PLAY_UPLOAD + PLAY_SERVICE_ACCOUNT_JSON)
        type: boolean
        default: false

permissions:
  contents: read

env:
  FLUTTER_CHANNEL: stable

jobs:
  analyze-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android-aab:
    name: Android AAB
    needs: analyze-test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/mobile-v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/mobile
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Require Android signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 (and related keystore secrets)."
            exit 1
          fi

      - name: Write keystore
        working-directory: apps/mobile/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > upload-keystore.jks
          cat > key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Pub get
        run: flutter pub get

      - name: Build app bundle
        env:
          MOBILE_API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL }}
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
          MOBILE_ENV: prod
        run: |
          if [ -z "$MOBILE_API_BASE_URL" ]; then
            echo "Set GitHub variable MOBILE_API_BASE_URL on this environment."
            exit 1
          fi
          flutter build appbundle --release \
            --dart-define=ENV="$MOBILE_ENV" \
            --dart-define=API_BASE_URL="$MOBILE_API_BASE_URL" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID" \
            --dart-define=PRIVACY_POLICY_URL="${PRIVACY_POLICY_URL:-https://societyhub-client.onrender.com/privacy}" \
            --obfuscate --split-debug-info=build/debug-info

      - name: Stage AAB at artifact root
        run: |
          mkdir -p aab-artifact
          cp build/app/outputs/bundle/release/app-release.aab aab-artifact/app-release.aab
          cp -R build/debug-info aab-artifact/debug-info

      - uses: actions/upload-artifact@v4
        with:
          name: societyhub-android-aab
          path: apps/mobile/aab-artifact/*
          if-no-files-found: error
          retention-days: 30

  play-internal:
    name: Play internal (draft)
    needs: android-aab
    if: >
      vars.ENABLE_PLAY_UPLOAD == 'true' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.upload_play == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: societyhub-android-aab
          path: artifacts

      - name: Locate AAB
        id: aab
        run: |
          aab=$(find artifacts -name 'app-release.aab' -type f | head -n 1)
          if [ -z "$aab" ]; then
            echo "app-release.aab not in artifact"
            find artifacts -type f
            exit 1
          fi
          echo "Found $aab"
          echo "path=$aab" >> "$GITHUB_OUTPUT"

      - name: Upload AAB to Play internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.societyhub.societyhub_mobile
          releaseFiles: ${{ steps.aab.outputs.path }}
          track: internal
          status: draft

  ios-ipa:
    name: iOS IPA
    needs: analyze-test
    if: >
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/mobile-v')) &&
      vars.ENABLE_IOS_IPA == 'true' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.build_ios == 'true')
    runs-on: macos-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: apps/mobile
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: CocoaPods
        run: |
          cd ios
          pod install

      - name: Pub get
        run: flutter pub get

      - name: Build IPA
        env:
          MOBILE_API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL }}
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
          MOBILE_ENV: prod
        run: |
          if [ -z "$MOBILE_API_BASE_URL" ]; then
            echo "Set GitHub variable MOBILE_API_BASE_URL on this environment."
            exit 1
          fi
          flutter build ipa --release \
            --dart-define=ENV="$MOBILE_ENV" \
            --dart-define=API_BASE_URL="$MOBILE_API_BASE_URL" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID" \
            --dart-define=PRIVACY_POLICY_URL="${PRIVACY_POLICY_URL:-https://societyhub-client.onrender.com/privacy}" \
            --obfuscate --split-debug-info=build/debug-info

      - uses: actions/upload-artifact@v4
        with:
          name: societyhub-ios-ipa
          path: |
            apps/mobile/build/ios/ipa/*.ipa
            apps/mobile/build/debug-info
          if-no-files-found: error
          retention-days: 30
