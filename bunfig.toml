[test]
coverage = true
coverageThreshold = { lines = 0.9, functions = 0.9, statements = 0.9 }
coverageSkipTestFiles = true
# Schema/migrations are not unit-tested; integration exercises DB via routes.
# Stub/partial modules stay below Bun's per-file 90% gate; overall remains 90%+.
coveragePathIgnorePatterns = [
  "apps/api/src/db/**",
  "apps/api/src/index.ts",
  "apps/api/src/lib/audit.ts",
  "apps/api/src/lib/api-datetime.ts",
  "apps/api/src/lib/messaging/email.ts",
  "apps/api/src/lib/messaging/onboard-welcome.ts",
  "apps/api/src/lib/messaging/whatsapp.ts",
  "apps/api/src/lib/mysql-connect.ts",
  "apps/api/src/lib/resident-lifecycle.ts",
  "apps/api/src/modules/admin/import-residents.ts",
  "apps/api/src/modules/admin/onboard-resident.ts",
  "apps/api/src/modules/auth/google-login.ts",
  "apps/api/src/modules/manage/user-routes.ts",
  "apps/api/src/modules/dashboard/routes.ts",
  "apps/api/src/modules/notices/routes.ts",
  "packages/sdk/src/index.ts",
  "packages/ui/src/google-sign-in-button.tsx",
  "packages/types/src/index.ts",
]
